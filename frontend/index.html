<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SkyCoffee – Онлайн замовлення</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="hero">
        <h1>SkyCoffee</h1>
        <p>Свіжа кава щодня</p>
    </header>

    <nav class="categories">
        <button class="cat-btn">Кава</button>
        <button class="cat-btn">Десерти</button>
        <button class="cat-btn">Напої</button>
    </nav>

    <div id="status"></div>

    <main class="container">
        <section id="menu-section">
            <h2>Меню</h2>
            <div id="menu"></div>
        </section>

        <section id="cart-section">
            <h2>Кошик</h2>
            <ul id="cart"></ul>
            <p id="total">Сума: 0 грн</p>

            <h3>Оформлення замовлення</h3>
            <input id="name" type="text" placeholder="Ваше імʼя">
            <input id="phone" type="text" placeholder="Телефон">
            <button id="orderBtn">Замовити</button>
        </section>
    </main>

    <footer>
        <p>SkyCoffee © 2026</p>
    </footer>

    
    <script type="module" src="app.js"></script>
</body>
</html>
